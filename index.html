<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roku Control</title>
  <style>
    :root {
      --bg: #0a0a12;
      --bg2: #111122;
      --bg3: #1a1a30;
      --purple: #7c3aed;
      --purple-glow: #a78bfa;
      --purple-dark: #4c1d95;
      --text: #e2e8f0;
      --text-dim: #8899aa;
      --border: #1e1e3a;
      --radius: 14px;
      --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      overflow: hidden; height: 100vh; user-select: none;
      border-radius: 14px;
    }
    #root { height: 100vh; display: flex; flex-direction: column; }
    .titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--bg2); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .titlebar-text { font-weight: 600; font-size: 13px; color: var(--text-dim); }
    .tb-btn {
      width: 28px; height: 28px; border: none; border-radius: 6px;
      background: transparent; color: var(--text-dim); font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .tb-btn:hover { background: var(--bg3); color: var(--text); }
    .tb-btn.close:hover { background: #ef4444; color: #fff; }
    .device-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--bg2); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .device-select {
      flex: 1; background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); padding: 7px 10px;
      font-size: 13px; cursor: pointer; outline: none;
    }
    .device-select:focus { border-color: var(--purple); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.on { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot.standby { background: #f59e0b; box-shadow: 0 0 4px #f59e0b; }
    .dot.off { background: #ef4444; }
    .main-content {
      flex: 1; overflow-y: auto; padding: 10px;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
    }
    .main-content::-webkit-scrollbar { width: 3px; }
    .main-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .dpad {
      display: grid; grid-template-columns: 56px 56px 56px;
      grid-template-rows: 56px 56px 56px; gap: 5px; margin: 6px 0;
    }
    .dbtn {
      width: 56px; height: 56px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg3); color: var(--text); font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }
    .dbtn:hover { background: var(--purple-dark); border-color: var(--purple); box-shadow: 0 0 12px rgba(124,58,237,0.3); }
    .dbtn:active { transform: scale(0.9); background: var(--purple); }
    .dbtn.c { background: var(--purple-dark); border-color: var(--purple); font-weight: 700; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg3); color: var(--text); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.12s; white-space: nowrap;
    }
    .btn:hover { background: var(--purple-dark); border-color: var(--purple); }
    .btn:active { background: var(--purple); transform: scale(0.95); }
    .btn.sp { background: var(--purple-dark); border-color: var(--purple); }
    .vol-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; background: var(--bg3); border-radius: var(--radius-sm);
      border: 1px solid var(--border); width: 100%;
    }
    .vbtn {
      width: 32px; height: 32px; border: none; border-radius: 50%;
      background: var(--bg2); color: var(--text); font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .vbtn:hover { background: var(--purple-dark); }
    .vslider {
      flex: 1; -webkit-appearance: none; height: 6px; border-radius: 3px;
      background: var(--border); outline: none; cursor: pointer;
    }
    .vslider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: var(--purple); box-shadow: 0 0 8px rgba(124,58,237,0.5);
    }
    .app-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 5px; max-height: 180px; overflow-y: auto; width: 100%;
    }
    .app-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 4px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); cursor: pointer; text-align: center;
      transition: all 0.12s;
    }
    .app-item:hover { background: var(--purple-dark); border-color: var(--purple); transform: translateY(-1px); }
    .app-icon { font-size: 20px; }
    .app-name { font-size: 9px; color: var(--text-dim); line-height: 1.1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .status-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 6px; width: 100%; font-size: 11px;
    }
    .widget .titlebar { padding: 6px 10px; }
    .widget .dbtn { width: 48px; height: 48px; font-size: 15px; }
    .widget .dpad { grid-template-columns: 48px 48px 48px; grid-template-rows: 48px 48px 48px; }
    .widget .btn { padding: 5px 10px; font-size: 10px; }
    .scanning { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
