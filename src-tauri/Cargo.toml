[package]
name = "roku-control"
version = "2.1.0"
description = "Roku Remote Control — cross-platform desktop app"
authors = ["Wade"]
license = "MIT"
repository = "https://github.com/BlizzHacker/RokuControl"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Plain HTTP to devices on the LAN only: no TLS stack, no proxy detection.
reqwest = { version = "0.12", default-features = false }
socket2 = "0.6"
if-addrs = "0.13"
base64 = "0.22"
