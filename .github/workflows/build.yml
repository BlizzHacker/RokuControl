name: Build installers

# Runs by hand from the Actions tab (optionally publishing a release and
# submitting to the Microsoft Store), on a version tag (v2.1.0), or on a pull
# request labelled "build-installers" (a downloadable preview for testing).
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with this tag (e.g. v2.1.0). Leave empty to only build.
        required: false
        default: ''
      store:
        description: Also submit the MSIX to the Microsoft Store (needs the PARTNER_CENTER_* secrets)
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-installers')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: npm ci

      # tauri:build builds the frontend first (beforeBuildCommand), so the
      # installer never ships an empty window.
      - run: npm run tauri:build

      # The Microsoft Store listing is an MSIX product: package the same exe
      # with msix/AppxManifest.xml using the Windows SDK's makeappx. Partner
      # Center signs it on upload.
      - name: Package for the Microsoft Store (MSIX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $makeappx) { throw 'makeappx.exe not found in the Windows SDK' }
          $version = (Select-Xml -Path msix/AppxManifest.xml -Namespace @{ m = 'http://schemas.microsoft.com/appx/manifest/foundation/windows10' } -XPath '/m:Package/m:Identity').Node.Version
          $stage = Join-Path $env:RUNNER_TEMP 'msix'
          New-Item -ItemType Directory -Force (Join-Path $stage 'Assets') | Out-Null
          Copy-Item src-tauri/target/release/roku-control.exe $stage
          Copy-Item msix/AppxManifest.xml $stage
          Copy-Item msix/Assets/* (Join-Path $stage 'Assets')
          New-Item -ItemType Directory -Force src-tauri/target/release/bundle/msix | Out-Null
          & $makeappx.FullName pack /d $stage /p "src-tauri/target/release/bundle/msix/RokuControl_${version}_x64.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: roku-control-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msix/*.msix
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  # Publish the installers as a GitHub release, so there is a direct download
  # link. A release asked for from the Actions tab is published right away;
  # pushed tags with a suffix (v2.1.0-beta.1) publish a pre-release and plain
  # version tags make a draft to review first; a labelled PR gets a
  # "preview-pr<N>" pre-release that is replaced on every push.
  release:
    name: Publish release
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || inputs.release != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_TAG: ${{ inputs.release }}
        run: |
          mapfile -t files < <(find installers -type f)
          printf 'Attaching: %s\n' "${files[@]}"
          if [ "$EVENT" = pull_request ]; then
            tag="preview-pr$PR_NUMBER"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$PR_SHA" --prerelease \
              --title "Preview build — PR #$PR_NUMBER" \
              --notes "Test build of pull request #$PR_NUMBER at $PR_SHA. Not a release. Installers are unsigned, so Windows may show a SmartScreen warning: choose More info → Run anyway."
          elif [ "$EVENT" = workflow_dispatch ]; then
            if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Release tag must look like v2.1.0 or v2.1.0-beta.1, got '$INPUT_TAG'"
              exit 1
            fi
            kind=--latest
            case "$INPUT_TAG" in *-*) kind=--prerelease ;; esac
            gh release create "$INPUT_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Roku Control $INPUT_TAG" --generate-notes "$kind"
          else
            kind=--draft
            case "$REF_NAME" in *-*) kind=--prerelease ;; esac
            gh release create "$REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Roku Control $REF_NAME" --generate-notes "$kind"
          fi

  # Submit the MSIX to the Microsoft Store listing (product 9MTNNGZKJ1WK) with
  # Microsoft's Store CLI. Needs an Azure AD app linked in Partner Center; its
  # IDs go in the PARTNER_CENTER_* repository secrets. Certification then
  # takes Microsoft a few hours to a few days.
  store:
    name: Submit to Microsoft Store
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.store && needs.build.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roku-control-Windows
          path: windows

      - name: Check the Partner Center secrets
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $missing = 'TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET' | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            Write-Output "::error::Missing repository secrets: $($missing | ForEach-Object { "PARTNER_CENTER_$_" }). See STORE.md."
            exit 1
          }

      - uses: microsoft/setup-msstore-cli@v1

      - name: Submit the MSIX
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $msix = Get-ChildItem windows -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw 'No .msix in the Windows build' }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msstore publish -v -i $msix.FullName -id 9MTNNGZKJ1WK
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
